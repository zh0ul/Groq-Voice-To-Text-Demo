<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" sizes="32x32" href='https://console.groq.com/favicon.ico'/>
    <title>Voice-to-Text with Groq</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1, h2, h3, h4, h5, h6 {
            color: #ffffff;
        }

        label {
            margin: 5px;
        }

        a {
            color: #00f; /* Bright blue */
        }

        a:visited {
            color: #ee69b4; /* Hot pink */
        }

        button {
            color: #ffffff;
            background-color: #1e88e5;
            cursor: pointer;
            font-size: 14px;
            border: 1px solid #ffffff;
            border-radius: 5px;
            padding: 10px;
            margin: 5px;
            margin-bottom: 20px;
            width: 95%;
            /* max-width: 400px; */
            /* max-width: 95%; */
        }

        button:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }

        button:hover:enabled {
            background-color: #1565c0;
        }

        input[type="text"], input[type="password"], input[type="file"], textarea {
            color: #ffffff;
            background-color: #1f1f1f;
            font-size: 14px;
            border: 1px solid #ffffff;
            border-radius: 5px;
            padding: 10px;
            margin: 5px;
            margin-bottom: 20px;
            width: 90%;
            /* max-width: 400px; */
            /* max-width: 95%; */
        }

        select {
            color: #ffffff;
            background-color: #1f1f1f;
            font-size: 14px;
            border: 1px solid #ffffff;
            border-radius: 5px;
            padding: 10px;
            margin: 5px;
            margin-bottom: 20px;
            width: 96%;
            /* max-width: 400px; */
            /* max-width: 95%; */
        }

        #app {
            margin-top: 10px;
            margin-bottom: 10px;
            background-color: #1e1e1e;
            padding: 10px;
            border: 1px solid #ffffff;
            border-radius: 5px;
            /* max-width: 100%; */
            width: 400px;
            /* justify-content: center;
            align-items: center; */
        }

        #settingsDiv, #transRecDiv, #transFileDiv {
            margin-top: 10px;
            margin-bottom: 10px;
            background-color: #1e1e1e;
            padding: 10px;
            border: 1px solid #ffffff;
            border-radius: 5px;
            /* max-width: 100%; */
            width: 380px;
            /* justify-content: center;
            align-items: center; */
        }

        #oscilloscope {
            display: block;
            margin-top: 10px;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ffffff;
            background-color: #3f0000;
            /* max-width: 600px;
            max-height: 200px; */
            width: 95%;
            /* width: 95%; */
            /* height: 100px; */
            resize: vertical;
        }

        #badge {
            width: 80px;
            height: auto;
            text-align: center;
        }

        #badge a img {
            /* display: inline-block; */
            display: inline;
        }

        .tab {
            display: none;
        }
        .tab-header {
            display: flex;
        }
        .tab-header div {
            padding: 10px;
            cursor: pointer;
            background-color: #1e1e1e;
            border: 1px solid #ccc;
        }
        .tab-header div.active {
            background-color: #1e88e5;
        }
        .tab-content {
            border: 1px solid #ccc;
            padding: 10px;
        }

    </style>

</head>


<body>

    <div id="badge"><a href="https://groq.com" target="_blank" rel="noopener noreferrer"><img src="https://groq.com/wp-content/uploads/2024/03/PBG-mark1-color.svg" alt="Powered by Groq for fast inference."/></a></div>

    <div id="app">
        <h2 style="text-align: center;">Voice-To-Text with Groq</h2>
        <hr/><br/>

        <div id="settingsDiv">

            <h3 style="text-align: center;">Settings</h3>
            <hr/>

            <div id="apiKeyDiv">
                <label for="apiKey">Enter your Groq <a href="https://console.groq.com/keys" target="_blank">API Key</a>:</label><br>
                <input type="password" id="apiKey" placeholder="Your Groq API Key..." />
            </div>
       
            <div id="modelDiv">
                <label for="model">Select model:</label><br>
                <select id="model">
                    <option value="whisper-large-v3"                >whisper-large-v3</option>
                    <option value="whisper-large-v3-turbo"          >whisper-large-v3-turbo</option>
                    <option value="distil-whisper-large-v3-en"      >distil-whisper-large-v3-en</option>
                </select>
            </div>
    
            <div id="responseFormatDiv">
                <label for="responseFormat">Response Format:</label><br>
                <select id="responseFormat">
                    <option value="json" selected>json</option>
                    <option value="verbose_json">verbose_json (adds timestamps for audio segments)</option>
                </select>
            </div>
    
            <div id="temperatureDiv">
                <label for="temperature">Temperature (0.0 - 1.0):</label><br>
                <input type="text" id="temperature" placeholder="0.0" value="0.0" />
            </div>
        
            <div id="promptDiv">
                <label for="prompt" id="promptLabel">Prompt:</label><br>
                <textarea id="prompt" rows="3" cols="50" placeholder="Provide context or specify how to spell unfamiliar words. Limited to 224 tokens, or about 780 characters." value=""></textarea>
            </div>

        </div>

        <br/>

        <div class="tab-header">
            <div class="tab-link active" onclick="openTab(event, 'transFileDiv')">Transcribe File</div>
            <div class="tab-link" onclick="openTab(event, 'transRecDiv')">Transcribe Recording</div>
        </div>

        <div id="transFileDiv" class="tab-content tab" style="display: block;">

            <h3 style="text-align: center;">Transcribe File</h3>
            <hr/>

            <div id="fileUploadDiv">
                <label for="fileUpload">Upload Audio/Video File:</label><br>
                <input type="file" id="fileUpload" accept=".mp3,.mp4,.mpeg,.mpga,.m4a,.wav,.webm" />
            </div>

            <div id="transFileButtonDiv">
                <button id="transFileButton">Transcribe File</button>
            </div>

            <div id="transFileOutputDiv" style="display: none;">
                <!-- <h3 style="text-align: center;">Transcription</h3> -->
                <hr/>
                <textarea id="transFileOutput" rows="30" cols="50" placeholder="Transcription text will go here..." value=""></textarea>
            </div>
        </div>

        <div id="transRecDiv" class="tab-content tab" style="display: none;">
            <h3 style="text-align: center;">Transcribe Recording</h3>
            <hr/>
            <button id="startRecording">Start Recording</button><br>
            <button id="stopRecording">Stop Recording</button><br>
            <div id="timer" style="text-align: center;"><label>Recording Time: 0:00</label></div>
            <canvas id="oscilloscope" class="oscopeCanvas"></canvas>
            <hr/>
            <div id="transRecRecordingDiv"></div>
            <div id="transRecOutputDiv" style="display: none;">
                <!-- <h3 style="text-align: center;">Transcription</h3> -->
                <button id="transRecButton">Transcribe Recording</button>
                <hr/>
                <textarea id="transRecOutput" rows="30" cols="50" placeholder="Transcription text will go here..." value=""></textarea>
            </div>
        </div>

    </div>

    <script>
        /**********************/
        /* Link app elements */
        /********************/
        const appDiv                     = document.getElementById('app');
        const apiKeyField                = document.getElementById('apiKey');
        const promptField                = document.getElementById('prompt');
        const promptLabel                = document.getElementById('promptLabel');
        const fileUploadField            = document.getElementById('fileUpload');
        const responseFormatField        = document.getElementById('responseFormat');
        const temperatureField           = document.getElementById('temperature');
        const modelField                 = document.getElementById('model');
        const transFileDiv               = document.getElementById('transFileDiv');
        const transFileButton            = document.getElementById('transFileButton');
        const transFileOutputDiv         = document.getElementById('transFileOutputDiv');
        const transFileOutputField       = document.getElementById('transFileOutput');
        const transRecDiv                = document.getElementById('transRecDiv');
        const transRecOutputDiv          = document.getElementById('transRecOutputDiv');
        const transRecOutputField        = document.getElementById('transRecOutput');
        const startRecordingButton       = document.getElementById('startRecording');
        const stopRecordingButton        = document.getElementById('stopRecording');
        const transRecRecordingDiv       = document.getElementById('transRecRecordingDiv');
        const timerLabel                 = document.getElementById('timer');
        const oscilloscope               = document.getElementById('oscilloscope');
        const transRecButton             = document.getElementById('transRecButton');
        const canvasContext              = oscilloscope.getContext('2d');


        /*******************************/
        /* Live Transcription Globals */
        /*****************************/
        let mediaRecorder;
        let audioContext;
        let analyser;
        let dataArray;
        let source;
        let audioChunks = [];
        let animationId;
        let v_activity_threshold = 0.1; // Minimum delta value to detect voice activity
        let v_activity_timestamp = Date.now();
        let timerId;
        let startTime;
        let recordings = [];


        /***************************/
        /* transFileButton click */
        /*************************/
        transFileButton.addEventListener('click', async () => {

            const apiKey = apiKeyField.value;
            const model = modelField.value;
            const prompt = promptField.value;
            const response_format = responseFormatField.value;
            const temperature = temperatureField.value;
            const file = fileUploadField.files[0];

            if (apiKey      === "") {  alert('Please provide API key.');     apiKeyField.focus();       return; }
            if (model       === "") {  alert('Please provide Model.');       modelField.focus();        return; }
            if (temperature === "") {  alert('Please provide Temperature.'); temperatureField.focus();  return; }
            if (!file)              {  alert('Please upload a file.');                                  return; }

            try {
                transFileButton.disabled = true;

                transFileOutputDiv.style.display = 'block';

                transFileOutputField.value = 'Transcribing...';

                const fileBlob = new Blob([file], { type: file.type });
                const formData = new FormData();
                formData.append('file', fileBlob, file.name);
                formData.append('model', model);
                formData.append('prompt', prompt);
                formData.append('temperature', parseFloat(temperature));
                formData.append('response_format', response_format);
                formData.append('language', 'en');

                try {
                    const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`Error: ${response.status} ${response.statusText}`);
                    }

                    const result = await response.json();
                    transFileOutputField.value = JSON.stringify(result, null, 2);
                } catch (error) {
                    transFileOutputField.value = `An error occurred: ${error.message}`;
                }

            } catch (error) {
                console.error('Error transcribing media:', error);
                alert('Error transcribing media. Please check the console for more information.');
            } finally {
                transFileButton.disabled = false;
            }

        });

        

        /***************************/
        /* transRecButton click */
        /*************************/
        transRecButton.addEventListener('click', async () => {

            const apiKey = apiKeyField.value;
            const model = modelField.value;
            const prompt = promptField.value;
            const response_format = responseFormatField.value;
            const temperature = temperatureField.value;
            //const file = fileUploadField.files[0];
            const fileName = `recording_${recordings.length}.wav`;
            const fileBlob = recordings[0];

            if (apiKey      === "") {  alert('Please provide API key.');     apiKeyField.focus();       return; }
            if (model       === "") {  alert('Please provide Model.');       modelField.focus();        return; }
            if (temperature === "") {  alert('Please provide Temperature.'); temperatureField.focus();  return; }
            //if (!file)              {  alert('Please upload a file.');                                  return; }

            try {
                transRecButton.disabled = true;

                transRecOutputDiv.style.display = 'block';

                transRecOutputField.value = 'Transcribing...';

                // const fileBlob = new Blob([file], { type: file.type });
                const formData = new FormData();
                formData.append('file', fileBlob, fileName);
                formData.append('model', model);
                formData.append('prompt', prompt);
                formData.append('temperature', parseFloat(temperature));
                formData.append('response_format', response_format);
                formData.append('language', 'en');

                try {
                    const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`Error: ${response.status} ${response.statusText}`);
                    }

                    const result = await response.json();
                    transRecOutputField.value = JSON.stringify(result, null, 2);
                } catch (error) {
                    transRecOutputField.value = `An error occurred: ${error.message}`;
                }

            } catch (error) {
                console.error('Error transcribing media:', error);
                alert('Error transcribing media. Please check the console for more information.');
            } finally {
                transRecButton.disabled = false;
            }

        });


        startRecording.addEventListener('click', async () => {

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Your browser does not support audio recording.');
                return;
            }

            try {
                startRecording.disabled = true;
                stopRecording.disabled = false;

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/ogg' /*,  audioBitsPerSecond : 128000 */ });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                dataArray = new Uint8Array(analyser.fftSize);

                source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);

                drawOscilloscope();
                startTimer();

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    startRecording.disabled = false;
                    stopRecording.disabled = true;

                    const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });

                    const wavBlob = await convertOggBlobToWavBlob(audioBlob);

                    recordings.unshift(wavBlob); // Add audioBlob to recordings as the first element

                    audioChunks = []; // Clear audioChunks

                    //const audioURL = URL.createObjectURL(audioBlob);
                    const audioURL = URL.createObjectURL(wavBlob);

                    const audioElement = document.createElement('audio');
                    audioElement.controls = true;
                    audioElement.src = audioURL //URL.createObjectURL(audioBlob);

                    const canvasElement = document.createElement('canvas');
                    canvasElement.id = 'oscilloscope';
                    const canvasCtx = canvasElement.getContext('2d');

                    const audioContextForPlayback = new (window.AudioContext || window.webkitAudioContext)();
                    const analyserForPlayback = audioContextForPlayback.createAnalyser();
                    const sourceForPlayback = audioContextForPlayback.createMediaElementSource(audioElement);
                    sourceForPlayback.connect(analyserForPlayback);
                    analyserForPlayback.connect(audioContextForPlayback.destination);

                    const drawPlaybackOscilloscope = () => {
                        requestAnimationFrame(drawPlaybackOscilloscope);

                        const dataArrayForPlayback = new Uint8Array(analyserForPlayback.fftSize);
                        analyserForPlayback.getByteTimeDomainData(dataArrayForPlayback);

                        canvasCtx.lineWidth = 2;
                        canvasCtx.strokeStyle = '#ffffff';

                        canvasCtx.beginPath();

                        const sliceWidth = canvasElement.width / analyserForPlayback.fftSize;
                        let x = 0;
                        let v_min = 1000;
                        let v_max = 0;

                        for (let i = 0; i < analyserForPlayback.fftSize; i++) {
                            const v = dataArrayForPlayback[i] / 128.0;
                            const y = v * canvasElement.height / 2;
                            v_min = Math.min(v_min, v);
                            v_max = Math.max(v_max, v);

                            if (i === 0) {
                                canvasCtx.moveTo(x, y);
                            } else {
                                canvasCtx.lineTo(x, y);
                            }

                            x += sliceWidth;
                        }
                        
                        canvasCtx.fillStyle = "#" + (Math.min(255,(Math.floor((v_max-v_min)*255)+40))).toString(16).padStart(2, '0') + "0000";
                        canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                        canvasCtx.lineTo(canvasElement.width, canvasElement.height / 2);
                        canvasCtx.stroke();
                    };

                    audioElement.addEventListener('play', () => {
                        drawPlaybackOscilloscope();
                    });

                    const downloadButton = document.createElement('button');
                    downloadButton.textContent = 'Download .wav';
                    downloadButton.addEventListener('click', () => {
                        const a = document.createElement('a');
                        a.href = audioURL;
                        a.download = `recording_${recordings.length}.wav`;
                        a.click();
                        //URL.revokeObjectURL(audioURL); // Clean up URL object
                    });

                    const listItem = document.createElement('div');
                    listItem.appendChild(canvasElement);
                    listItem.appendChild(audioElement);
                    listItem.appendChild(downloadButton);
                    listItem.classList.add('pulse-twice');
                    transRecRecordingDiv.innerHTML = '';
                    transRecRecordingDiv.appendChild(listItem);

                    transRecOutputDiv.style.display = 'block';

                    cancelAnimationFrame(animationId);
                    clearInterval(timerId);
                    audioContext.close();
                };

                mediaRecorder.start();

            } catch (error) {
                console.error('Error accessing microphone:', error);
                alert('Could not access your microphone.');
            }
        });

        stopRecording.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                startRecording.disabled = false;
                stopRecording.disabled = true;
            }
        });

        function startTimer() {
            startTime = Date.now();
            timerId = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const minutes = Math.floor(elapsed / 60000);
                const seconds = Math.floor((elapsed % 60000) / 1000);
                timerLabel.textContent = `Recording Time: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            }, 1000)
        };

        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tab-link");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }

        function promptLabelUpdate() {
            promptLabel.textContent = `Prompt: (${promptField.value.length}/780 characters)`;
        }

        promptField.addEventListener('input', () => {
            promptLabelUpdate();
        });

        apiKeyField.addEventListener('focus', () => {
            apiKeyField.type = 'text';
            apiKeyField.select();
        });

        apiKeyField.addEventListener('blur', () => {
            apiKeyField.type = 'password';
            UpdateModels();
        });

    </script>

    <script>

        function drawOscilloscope() {
            animationId = requestAnimationFrame(drawOscilloscope);

            analyser.getByteTimeDomainData(dataArray);

            canvasContext.lineWidth = 2;
            canvasContext.strokeStyle = '#ffffff';

            canvasContext.beginPath();

            const sliceWidth = oscilloscope.width / analyser.fftSize;
            let x = 0;
            let v_min = 1000;
            let v_max = 0;

            // Draw the oscilloscope line segments
            for (let i = 0; i < analyser.fftSize; i++) {
                const v = dataArray[i] / 128.0;
                v_min = Math.min(v_min, v);
                v_max = Math.max(v_max, v);
                const y = v * oscilloscope.height / 2;

                if (i !== 0) {
                    canvasContext.lineTo(x, y);
                } else {
                    canvasContext.moveTo(x, y);
                }

                x += sliceWidth;
            }

            // Detect voice activity
            if (v_max-v_min > v_activity_threshold) v_activity_timestamp = Date.now();

            // Draw rectangle with color based on max value
            canvasContext.fillStyle = "#" + (Math.min(255,(Math.floor((v_max-v_min)*255)+40))).toString(16).padStart(2, '0') + "0000";
            canvasContext.fillRect(0, 0, oscilloscope.width, oscilloscope.height);

            // Draw last line at center
            canvasContext.fillStyle = "#ffffff";
            canvasContext.lineTo(oscilloscope.width, oscilloscope.height / 2);
            // Completes the path, drawing all of the lines as defined in the for loop.
            canvasContext.stroke();

            // Draw min, max and delta values
            const fontSize = 14;
            canvasContext.font = `${fontSize}px Terminal`;
            canvasContext.fillStyle = "#ffffff";
            const padWidth = canvasContext.measureText("VTime:").width + 6;
            canvasContext.fillText(`Min:`,   2, fontSize*1); canvasContext.fillText(`${(v_min-1).toString()}`,              padWidth, fontSize*1);
            canvasContext.fillText(`Max:`,   2, fontSize*2); canvasContext.fillText(`${(v_max-1).toString()}`,              padWidth, fontSize*2);
            canvasContext.fillText(`Delta:`, 2, fontSize*3); canvasContext.fillText(`${(v_max-v_min).toString()}`,          padWidth, fontSize*3);
            canvasContext.fillText(`VTime:`, 2, fontSize*4); canvasContext.fillText(`${(v_activity_timestamp).toString()}`, padWidth, fontSize*4);
        }

        // Function to update the models drop-down list.
        async function UpdateModels() {

            const modelFilter = ["whisper"]; // Filter model id's by these strings
            const apiKey = document.getElementById('apiKey').value;

            if (!apiKey) return;

            if (apiKey === "") return;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/models', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': `application/json`
                    }
                });

                if (!response.ok) {
                    throw new Error(`Error: ${response.status} ${response.statusText}`);
                }

                const result = await response.json();
                const modelField = document.getElementById('model');
                const previousValue = modelField.value;

                // Sort result.data by model.id
                result.data.sort((a, b) => a.id.localeCompare(b.id));
                
                const previousHTML = modelField.innerHTML
                modelField.innerHTML = '';

                result.data.forEach((model) => {
                    if (modelFilter.some(filter => model.id.includes(filter))) {
                        const option = document.createElement('option');
                        option.value = model.id;
                        option.textContent = `${model.id}  (context_window: ${model.context_window})`;
                        if (model.id === previousValue) option.selected = true;
                        modelField.appendChild(option);
                    }
                });

                // If model field is empty now, restore the previous value.
                if (modelField.innerHTML === '')  modelField.innerHTML = previousHTML;

            } catch (error) {
                alert(`An error occurred while trying to update models list.\n\n${error.message}\n\nIf the error is a 401, that means the Groq API key is incorrect.`);
            }
        }


        // Set a unique prefix for the element IDs to avoid conflicts with other apps.
        const elementIdUniquePrefix = 'Groq-Voice-To-Text';

        function loadSaveElement(elementId,key,elementType='string') {
            document.addEventListener('DOMContentLoaded', () => {
                const element = document.getElementById(elementId);
                const elementSaveId = `${elementIdUniquePrefix}-${elementId}-${key}`;
                let savedValue = localStorage.getItem(elementSaveId);
                if (elementType === 'int')   savedValue = parseInt(savedValue);
                if (elementType === 'float') savedValue = parseFloat(savedValue);
                if (savedValue)  element[key] = savedValue;
                element.addEventListener('input', () => { localStorage.setItem(elementSaveId, element[key].toString()); });
            });
        }

        // Load values for elements and attach a listener to save their values on input.
        loadSaveElement('apiKey','value');
        loadSaveElement('responseFormat','value');
        loadSaveElement('prompt','value');
        loadSaveElement('temperature','value');
        loadSaveElement('model','value');

        // Post start-up initialization.
        document.addEventListener('DOMContentLoaded', () => {
            promptLabelUpdate(); // Updates the Prompt label with the character count.
            UpdateModels();
        });
    </script>

    <script>
        /**
         * Converts an Ogg (or other supported) audio Blob into a WAV Blob.
         * 
         * @param {Blob} oggBlob The audio Blob to convert.
         * @return {Promise<Blob>} A promise that resolves to a WAV Blob.
         */
        async function convertOggBlobToWavBlob(oggBlob) {
            // 1) Convert Blob to ArrayBuffer
            const arrayBuffer = await oggBlob.arrayBuffer();

            // 2) Decode the audio data using the Web Audio API
            const audioContext = new AudioContext();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

            // 3) Convert the AudioBuffer to a 16-bit PCM WAV array buffer
            const wavArrayBuffer = audioBufferToWav(audioBuffer);

            // 4) Create a Blob from the WAV array buffer
            return new Blob([wavArrayBuffer], { type: 'audio/wav' });
        }

        /**
         * Converts an AudioBuffer to a 16-bit PCM WAV in an ArrayBuffer.
         *
         * @param {AudioBuffer} audioBuffer 
         * @return {ArrayBuffer}
         */
        function audioBufferToWav(audioBuffer) {
            const numChannels = audioBuffer.numberOfChannels;
            const sampleRate = audioBuffer.sampleRate;
            const format = 1;      // PCM
            const bitDepth = 16;   // 16-bit

            // Convert interleaved data to 16-bit PCM
            const result = encodeWAV(audioBuffer, format, sampleRate, numChannels, bitDepth);
            return result;
        }

        /**
         * Encodes an AudioBuffer's channel data into a 16-bit PCM WAV ArrayBuffer.
         *
         * @param {AudioBuffer} audioBuffer 
         * @param {number} format - Audio format (1 = PCM)
         * @param {number} sampleRate
         * @param {number} numChannels
         * @param {number} bitDepth
         * @return {ArrayBuffer}
         */
        function encodeWAV(audioBuffer, format, sampleRate, numChannels, bitDepth) {
            // Collect channel data
            const channels = [];
            for (let i = 0; i < numChannels; i++) {
                channels.push(audioBuffer.getChannelData(i));
            }

            // Interleave the channel data
            const interleaved = interleave(channels);

            // Calculate buffer sizes
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            const byteRate = sampleRate * blockAlign;
            const dataSize = interleaved.length * bytesPerSample;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            // Helper function: write a string to DataView
            function writeString(dataView, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    dataView.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            // Write WAV container headers
            // RIFF chunk descriptor
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');

            // Format sub-chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);             // Subchunk1Size (16 for PCM)
            view.setUint16(20, format, true);         // Audio format (1 = PCM)
            view.setUint16(22, numChannels, true);    // Number of channels
            view.setUint32(24, sampleRate, true);     // Sample rate
            view.setUint32(28, byteRate, true);       // Byte rate
            view.setUint16(32, blockAlign, true);     // Block align
            view.setUint16(34, bitDepth, true);       // Bits per sample

            // Data sub-chunk
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            // Write the PCM samples
            let offset = 44;
            for (let i = 0; i < interleaved.length; i++) {
                // Clamping from float [-1, 1] to a 16-bit PCM range
                const sample = Math.max(-1, Math.min(1, interleaved[i]));
                view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                offset += 2;
            }
            return buffer;
        }

        /**
         * Interleave multiple channels of Float32Arrays into a single Float32Array.
         * 
         * @param {Float32Array[]} channels
         * @return {Float32Array}
         */
        function interleave(channels) {
            const length = channels[0].length;
            const numChannels = channels.length;
            const interleaved = new Float32Array(length * numChannels);

            let writeIndex = 0;
            for (let i = 0; i < length; i++) {
            for (let ch = 0; ch < numChannels; ch++) {
                interleaved[writeIndex++] = channels[ch][i];
            }
            }
            return interleaved;
        }
